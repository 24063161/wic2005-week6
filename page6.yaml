# page6.yaml: the words on your Week 6 page. make_page6.py puts each answer under its question.
# A few sentences each, in your own words, about YOUR overlay and YOUR evidence.
# Leave a blank line between paragraphs. Don't put your name or your full student ID in this file.

repository: https://github.com/24063161/wic2005-week6

answers:
  design:
    question: "Describe your design: hypervisors, tenants, VNIs and addresses. Which tenants overlap, and why did you place each VM where you did?"
    answer: "The overlay sits on a 10.61.0.0/24 underlay with three hypervisors: hv1 (10.61.0.1), hv2 (10.61.0.2), and hv3 (10.61.0.3). Two tenants share the exact same subnet, 10.61.50.0/24. Tenant red uses VNI 100, while tenant blue uses VNI 200.\n\nTenant red spans all three hypervisors: red1 (10.61.50.10) sits on hv1, red2 (10.61.50.11) on hv2, and red3 (10.61.50.12) on hv3. Distributing red across all three machines forces all inter-VM traffic over the VXLAN tunnel mesh. It also gives us a third node (hv3) to catch flooded ARP copies during head-end replication between hv1 and hv2.\n\nTenant blue lives on hv1 and hv3: blue1 (10.61.50.10) runs on hv1, and blue2 (10.61.50.11) on hv3. This setup intentionally co-locates VMs on two hosts. hv1 runs both red1 and blue1, while hv3 runs red3 and blue2. Crucially, blue1 and red1 share 10.61.50.10, while blue2 and red2 share 10.61.50.11. Placing identical addresses on different hypervisors tests cross-host isolation, while putting two tenants on hv1 tests local bridge separation."
  isolation:
    question: "Two of your VMs have the same IP address. Using your evidence, explain how a ping reaches the right one — and what would have to go wrong for one tenant to see another's traffic."
    answer: "Both red2 and blue2 use 10.61.50.11, but traffic never mixes because hypervisors separate tenants at Layer 2 before encapsulation. When red1 pings 10.61.50.11, its frame enters hv1 through hv1-eth1, which belongs exclusively to br100. br100 forwards the frame solely to vxlan100. The kernel wraps the frame inside a UDP packet tagged with VNI 100. On arrival at remote hosts, the outer packet is stripped, and the frame is delivered strictly to br100. Because blue2 is attached to br200 on hv3, it never receives frames from br100. The capture on blue2-eth0 showed 0 packets while red1 pinged.\n\nThe ARP entries in evidence6/isolation.txt confirm this separation through MAC addresses. red1 resolved 10.61.50.11 to 02:00:00:64:00:0b (VNI 100 in hex is 0x64), whereas blue1 resolved the same IP to 02:00:00:c8:00:0b (VNI 200 in hex is 0xc8).\n\nFor one tenant to see another's traffic, an operator would have to misconfigure the hypervisor plumbing. Enslaving a VM's veth interface to the wrong tenant bridge, assigning identical VNIs to different bridges, or enabling IP routing between tenant bridges without VRF isolation would breach the boundary. The underlay network itself cannot leak traffic because it treats all VXLAN payloads as opaque UDP bytes."
  flood_learn:
    question: "Using your evidence, explain what was flooded, to which hypervisors, and what each VTEP learned. With 50 hypervisors in one VNI, how many copies would one broadcast need — and how would EVPN change that?"
    answer: "Before any traffic flowed, hv1's VTEP table had only two default flood entries: 00:00:00:00:00:00 pointing to 10.61.0.2 and 10.61.0.3. When red1 pinged 10.61.50.11, it emitted an initial ARP broadcast to find red2. Because the target MAC was unknown, hv1 copied the packet to every hypervisor on its flood list. The capture on hv3-eth0 caught this packet: a VXLAN frame carrying an ARP request for 10.61.50.11. hv3 received this broadcast despite hosting no VM with that address.\n\nhv3 parsed the inner frame and learned that red1 (02:00:00:64:00:0a) lives at 10.61.0.1. Once red2 replied, hv1 received the unicast response and learned red2 (02:00:00:64:00:0b) at 10.61.0.2. Subsequent pings went straight between hv1 and hv2 as unicast tunnels. hv3 saw nothing more.\n\nWith 50 hypervisors in one VNI, head-end replication scales poorly. Very poorly. A single broadcast frame forces the host CPU to generate 49 separate encapsulated copies. That wastes bandwidth and saturates physical uplinks with redundant traffic.\n\nBGP EVPN completely replaces this flood-and-learn mechanism. Instead of broadcasting over the data plane, VTEPs announce MAC and IP bindings via BGP Type-2 routes when VMs boot. Hypervisors look up destination VTEPs from their local routing table, eliminating unknown unicast flooding. Local VTEPs also answer tenant ARP requests directly through ARP suppression. ARP packets never hit the underlay fabric."
  mtu:
    question: "Compare your two MTU fixes using your measurements. Which would you choose for a data centre, what does each cost, and who has to change what?"
    answer: "Our tests in evidence6/fixes.txt show a clear performance trade-off between the two fixes. Lowering tenant MTU to 1450 (Fix A) capped ICMP payloads at 1422 bytes and delivered 6.03 Gbits/sec in iperf3. Raising the underlay MTU to 9000 (Fix B) let tenant VMs transmit standard 1472-byte payloads (1500 bytes IP), reaching 6.27 Gbits/sec. That 4% throughput gain comes from reducing header overhead and cutting the packet rate for bulk transfers.\n\nFix B is the obvious choice for data centres. Its main cost lies in infrastructure management. Every physical switch, router, and hypervisor uplink across the fabric must have its MTU raised to 9000 or 9216. One misconfigured transit port creates an immediate black hole.\n\nFix A avoids touching switch configs, but pushes the headache onto tenants. Virtual machine images expect a standard 1500-byte MTU out of the box. Forcing 1450 requires configuring DHCP MTU options or cloud-init automation. If a tenant VM ignores DHCP MTU or runs applications that disable Path MTU Discovery, large packets vanish silently. Fix B keeps tenant VMs completely vanilla by solving the encapsulation overhead where it belongs: in the underlay."
  p4:
    question: "If your hypervisors' VTEPs were P4 switches running the lecture's vtep.p4, what would have to fill the vtep_encap table, and how? What would replace flood-and-learn?"
    answer: "In a P4 switch running vtep.p4, the data plane cannot learn MAC addresses on its own. It has no built-in bridge learning logic. An external control plane agent, such as an SDN controller or an EVPN daemon, must populate the vtep_encap table using P4Runtime over gRPC. When a VM spins up or moves, the controller pushes an entry matching the inner destination MAC and setting the tunnel parameters: destination underlay IP, VNI, and physical egress port.\n\nControl-plane discovery replaces flood-and-learn entirely. Because the cloud orchestrator knows where every VM is provisioned, it programs forwarding entries before VMs start talking. Switches look up destinations directly, so unknown unicast flooding simply does not exist.\n\nFor ARP, the P4 switch or controller acts as a local proxy. It answers tenant ARP requests directly from known database entries. Flooding across the fabric is eliminated. For genuine multicast or broadcast, the P4 pipeline passes frames to a Multicast Group in its Packet Replication Engine (PRE), taking over the role of the Linux bridge flood list."
