# mtu_b.yaml: fix B: tenants stay at 1500; the underlay's MTU is raised to 9000 (jumbo frames)
student_id_last4: "3161"

underlay:
  network: 10.61.0.0/24
  mtu: 9000                    # raised to 9000 jumbo frames

hypervisors: [hv1, hv2, hv3]

tenants:
  - name: red
    vni: 100
    network: 10.61.50.0/24
    mtu: 1500                  # stays at 1500 standard Ethernet MTU
    vms:                       # [VM name, the hypervisor it runs on]
      - [red1, hv1]
      - [red2, hv2]
      - [red3, hv3]
  - name: blue
    vni: 200
    network: 10.61.50.0/24      # the same addresses as red, on purpose
    mtu: 1500
    vms:
      - [blue1, hv1]
      - [blue2, hv3]
